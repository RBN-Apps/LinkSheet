name: Build and publish fork nightly

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-nightly-release
  cancel-in-progress: false

jobs:
  nightly:
    name: Build and publish FOSS nightly
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore signing keystore
        id: keystore
        uses: timheuer/base64-to-file@v1
        with:
          fileName: linksheet-fork-signing.jks
          encodedString: ${{ secrets.KEYSTORE_FILE }}

      - name: Update bundled CleanURLs rules
        run: ./gradlew :integration-clearurl:updateRules

      - name: Build signed FOSS nightly APK
        env:
          GITHUB_WORKFLOW_RUN_ID: ${{ github.run_id }}
          NIGHTLY_APPLICATION_ID_SUFFIX: .rbnapps.nightly
          NIGHTLY_APP_NAME: LinkSheet RBN Nightly
          KEYSTORE_FILE_PATH: ${{ steps.keystore.outputs.filePath }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FLAVOR_CONFIG: ''
          API_HOST: ${{ vars.API_HOST }}
        run: ./gradlew assembleFossNightly

      - name: Read APK metadata
        id: apk
        env:
          OUTPUT_METADATA_JSON: app/build/outputs/apk/foss/nightly/output-metadata.json
        shell: bash
        run: |
          set -euo pipefail

          echo "version_code=$(jq -r '.elements[0].versionCode' "$OUTPUT_METADATA_JSON")" >> "$GITHUB_OUTPUT"
          echo "version_name=$(jq -r '.elements[0].versionName' "$OUTPUT_METADATA_JSON")" >> "$GITHUB_OUTPUT"
          echo "output_file=$(jq -r '.elements[0].outputFile' "$OUTPUT_METADATA_JSON")" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linksheet-fork-nightly
          path: app/build/outputs/apk/foss/nightly/${{ steps.apk.outputs.output_file }}

      - name: Create GitHub nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_FILE: app/build/outputs/apk/foss/nightly/${{ steps.apk.outputs.output_file }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
        run: |
          set -euo pipefail

          # app/build.gradle.kts expects nightly tags in nightly-YYYYMMDDNN format.
          build_number=$(printf '%02d' "$(( (GITHUB_RUN_NUMBER + GITHUB_RUN_ATTEMPT - 1) % 100 ))")
          NIGHTLY_TAG="nightly-$(date -u +%Y%m%d)${build_number}"

          gh release create "$NIGHTLY_TAG" "$APK_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LinkSheet Fork Nightly $VERSION_NAME ($VERSION_CODE)" \
            --notes "Automatic nightly build from commit $GITHUB_SHA." \
            --prerelease
