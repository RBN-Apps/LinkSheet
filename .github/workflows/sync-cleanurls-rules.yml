name: Sync CleanURLs rules

on:
  schedule:
    # Refresh the rules shortly after the upstream project sync runs.
    - cron: "47 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Keep this in sync with the upstream workflow so both maintenance jobs
  # cannot update master at the same time.
  group: repository-maintenance
  cancel-in-progress: false

env:
  BASE_BRANCH: master
  RULES_FILE: integration/clearurl/src/main/resources/fe/clearurlskt/clearurls.json

jobs:
  sync:
    name: Update bundled ClearURLs rules
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          # The app interprets tags named nightly-YYYYMMDDNN as version data.
          # A shallow checkout keeps legacy fork tags out of this Gradle task.
          fetch-depth: 1
          fetch-tags: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download latest rules
        run: ./gradlew :integration-clearurl:updateRules

      - name: Commit changed rules and start nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- "${RULES_FILE}"; then
            echo "No ClearURLs rule changes found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${RULES_FILE}"
          git commit -m "chore: update CleanURLs rules"
          git push origin "HEAD:${BASE_BRANCH}"

          # A push made with GITHUB_TOKEN does not trigger another workflow.
          gh workflow run fork-nightly-release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${BASE_BRANCH}"
